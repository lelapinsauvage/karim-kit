<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hero</title>
<style>
  /* Bayard — Vocal Type Co. Drawn from the placards of the 1963 March on
     Washington. Sign-painter caps: it carries weight without needing size. */
  @font-face { font-family:'Bayard'; src:url('/public/fonts/bayard.woff2') format('woff2'); font-display:swap }
  @font-face { font-family:'America'; src:url('/public/fonts/america-regular.woff2') format('woff2'); font-display:swap }

  :root{
    --ink:#F2EDE4;
    --dim:rgba(242,237,228,.45);
    --faint:rgba(242,237,228,.22);
    --pad:clamp(20px,2.6vw,44px);
  }
  /* light ground: the DOM layer inverts with the scene, or it vanishes */
  body.paper{
    --ink:#141414;
    --dim:rgba(20,20,20,.55);
    --faint:rgba(20,20,20,.22);
  }
  body.paper .rule{background:rgba(20,20,20,.14)}
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0708}
  body{font-family:'America',system-ui,sans-serif;color:var(--ink)}
  canvas{position:fixed;top:0;left:0;display:block}

  .frame{position:fixed;inset:0;z-index:3;pointer-events:none}
  .frame *{pointer-events:auto}

  .meta{
    position:absolute;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--dim);font-variant-numeric:tabular-nums;line-height:1.7;
  }
  .tl{top:var(--pad);left:var(--pad)}
  .tr{top:var(--pad);right:var(--pad);text-align:right}
  .bl{bottom:var(--pad);left:var(--pad)}
  .br{bottom:var(--pad);right:var(--pad);text-align:right}

  /* the mark: Bayard, flat and enormous. one loud face, never two. */

  .rail{
    position:absolute;left:var(--pad);bottom:calc(var(--pad) + 74px);
    display:grid;gap:3px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  }
  .rail div{display:grid;grid-template-columns:9ch 1fr;gap:12px}
  .rail dt{color:var(--dim)}

  nav{position:absolute;top:var(--pad);right:var(--pad);display:flex;gap:26px}
  nav a{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--dim);text-decoration:none;transition:color .25s;
  }
  nav a:hover{color:var(--ink)}

  .drop{
    position:absolute;right:var(--pad);bottom:var(--pad);text-align:right;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  }
  .drop b{display:block;font-family:'Bayard',Impact,sans-serif;font-size:26px;letter-spacing:0;font-weight:400;margin-top:6px}

  .rule{position:absolute;left:var(--pad);right:var(--pad);top:calc(var(--pad) + 34px);height:1px;background:rgba(242,237,228,.10)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="frame">
  <div class="meta tl">Lot 04 / 04<br>SS 26</div>
  <nav>
    <a href="#">Index</a><a href="#">Pigments</a><a href="#">Access</a>
  </nav>
  <div class="rule"></div>

  <div class="rail">
    <div><dt>Pigment</dt><dd>Red earth · Otjize</dd></div>
    <div><dt>Origin</dt><dd>Kunene</dd></div>
    <div><dt>Cloth</dt><dd>Bogolan, cast brass</dd></div>
    <div><dt>Edition</dt><dd>Of twelve</dd></div>
  </div>

  <div class="meta bl" style="bottom:var(--pad)">← → to change lot</div>
  <div class="drop">First release<b>09 · 26</b></div>
</div>

<script>
  // set before the module loads, so the wordmark draws as soon as Bayard is ready
  // left-aligned and pushed left: she should interrupt the word near its end, not
  // swallow it. reading OTJI- and inferring the rest is the effect; reading OT is
  // just a covered headline.
  window.__wordmark = ['OTJIZE', { size: 0.175, x: 0.035, y: 0.42, align: 'left', tracking: '-0.035em' }];
</script>
<script type="module" src="/src/sun.js"></script>
</body>
</html>
