<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hero</title>
<style>
  /* Display: Bayard, always. Vocal Type Co., drawn from the placards of the
     1963 March on Washington -- it is the only element on the page carrying the
     concept in the letterforms themselves, and no grotesque substitutes for
     that. Data: IBM Plex Mono, tabular by nature, says "catalogue" without
     decoration. One loud face, one quiet one. */
  @font-face{font-family:'Disp';src:url('/public/fonts/bayard.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Mono';src:url('/public/fonts/plex-mono-regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Mono';src:url('/public/fonts/plex-mono-semibold.woff2') format('woff2');font-weight:600;font-display:swap}
  

  :root{
    --ink:#141414;
    --dim:rgba(20,20,20,.52);
    --hair:rgba(20,20,20,.16);
    --pad:3rem;                      /* 48px on the reference board */
  }

  /* THE SCALE.
     Every size below is in rem, taken straight off the 1920 artboard: 1rem is
     16px there, so a 169px heading is 10.5625rem and it stays 169px at 1920 and
     scales proportionally everywhere else. Hard pixel values would have been
     right on exactly one screen width -- which is the width the mock happened
     to be drawn at, not a decision.
     Clamped so it neither collapses on a laptop nor runs away on a 4K panel. */
  html{ font-size: clamp(10.5px, 100vw / 120, 19px); }
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#F5F5F5}
  body{font-family:'Mono',ui-monospace,monospace;color:var(--ink)}
  canvas{position:fixed;top:0;left:0;display:block}

  .frame{position:fixed;inset:0;z-index:3;pointer-events:none}
  .frame *{pointer-events:auto}

  /* the one hard edge on the page */
  .rule{position:absolute;left:0;right:0;top:calc(var(--pad) + 3.5rem);height:1px;background:var(--hair)}

  .mark{
    position:absolute;top:var(--pad);left:50%;transform:translateX(-50%);
    font-family:'Disp',Impact,sans-serif;font-size:3.125rem;letter-spacing:0;
    text-transform:uppercase;
  }

  .meta{position:absolute;font-size:1rem;font-weight:600;letter-spacing:-.04em;color:var(--dim);
    text-transform:uppercase;font-variant-numeric:tabular-nums;line-height:1.8}
  .tl{top:var(--pad);left:var(--pad)}
  .tr{top:var(--pad);right:var(--pad);text-align:right}
  .bl{bottom:var(--pad);left:var(--pad)}

  /* THE LOCKUP, split across her on a shared baseline. She interrupts a line
     the eye wants to finish, which is what makes her the subject rather than a
     picture the type sits beside. */
  .lock{
    position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);
    display:flex;justify-content:space-between;align-items:baseline;
    padding:0 var(--pad);
    font-family:'Disp',Impact,sans-serif;
    font-size:10.5625rem;line-height:.86;letter-spacing:-.04em;
    text-transform:uppercase;
  }
  .lock sup{font-size:4rem;font-weight:400;letter-spacing:-.04em;vertical-align:super;margin-left:.12rem}

  /* the record. bold labels, regular values, one column each. */
  .rail{position:absolute;left:var(--pad);bottom:calc(var(--pad) + 3rem);
    display:grid;gap:.5rem;font-size:1rem;letter-spacing:-.04em}
  .rail div{display:grid;grid-template-columns:8ch 1fr;gap:1.5rem}
  .rail dt{font-weight:600;text-transform:uppercase}
  .rail dd{color:var(--dim);text-transform:uppercase}

  nav{position:absolute;top:var(--pad);right:var(--pad);display:flex;gap:2rem}
  nav a{font-size:1rem;font-weight:600;letter-spacing:-.04em;text-transform:uppercase;color:var(--dim);
    text-decoration:none;transition:color .2s}
  nav a:hover{color:var(--ink)}

  .count{position:fixed;left:var(--pad);bottom:var(--pad);z-index:30;
    font-family:'Disp',Impact,sans-serif;font-size:6rem;line-height:.8;
    color:#141414;font-variant-numeric:tabular-nums;letter-spacing:-.04em;
    mix-blend-mode:multiply;pointer-events:none}
</style>
</head>
<body class="paper">
<canvas id="c"></canvas>

<div class="frame" id="shell" style="opacity:0">
  <div class="rule"></div>
  <div class="mark">Maison Noir</div>
  <div class="meta tl"><span id="r-lot">Lot 01</span> &nbsp;·&nbsp; SS 26</div>
  <nav><a href="#">Index</a><a href="#">Pigments</a><a href="#">Access</a></nav>

  <h1 class="lock">
    <span id="r-name">Edition</span>
    <span>N<sup id="r-num">°01</sup></span>
  </h1>

  <div class="rail">
    <div><dt>Pigment</dt><dd id="r-pig">—</dd></div>
    <div><dt>Origin</dt><dd id="r-org">—</dd></div>
    <div><dt>Cloth</dt><dd id="r-cloth">—</dd></div>
    <div><dt>Edition</dt><dd id="r-ed">Twenty seven of one hundred</dd></div>
  </div>

  <div class="meta bl">← → to change lot</div>
</div>

<div class="count" id="pct">000</div>
<script type="module" src="/src/sun.js"></script>
</body>
</html>
