<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>sun</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0B0B0C}
  body{font:11px/1.5 ui-monospace,monospace;color:#eee}
  canvas{position:fixed;top:0;left:0;display:block}
  .panel{position:fixed;top:14px;right:14px;z-index:10;width:216px;padding:13px;
    background:#0b0b0be6;backdrop-filter:blur(8px);border:1px solid #ffffff1f;
    display:grid;gap:7px;max-height:94vh;overflow:auto}
  h2{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.45;font-weight:500}
  .row{display:grid;grid-template-columns:1fr auto;gap:4px}
  label{letter-spacing:.05em;opacity:.8} output{font-variant-numeric:tabular-nums;opacity:.5}
  input[type=range]{grid-column:1/-1;width:100%;accent-color:#FF4A1E;height:12px}
  input[type=color]{width:100%;height:19px;padding:0;border:1px solid #ffffff1f;background:none}
  .crow{display:grid;grid-template-columns:52px 30px 1fr;gap:5px;align-items:center}
  .crow label{opacity:.8}
  .hex{width:100%;background:#ffffff10;border:1px solid #ffffff1f;color:#eee;
    font:10px ui-monospace,monospace;padding:3px 5px;letter-spacing:.04em}
  .btn{width:100%;background:#ffffff12;border:1px solid #ffffff26;color:#eee;
    font:10px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
    padding:6px;cursor:pointer;margin-top:2px}
  .btn:hover{background:#ffffff20}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h2>body</h2>
  <div class="row"><label>radius</label><output id="o-r"></output><input id="r" type="range" min="0.05" max="0.8" step="0.005" value="0.30"></div>
  <div class="row"><label>edge</label><output id="o-edge"></output><input id="edge" type="range" min="0.001" max="0.4" step="0.001" value="0.035"></div>
  <div class="row"><label>core x</label><output id="o-coreX"></output><input id="coreX" type="range" min="-1" max="1" step="0.01" value="0.22"></div>
  <div class="row"><label>core y</label><output id="o-coreY"></output><input id="coreY" type="range" min="-1" max="1" step="0.01" value="0.34"></div>
  <div class="row"><label>core size</label><output id="o-coreSize"></output><input id="coreSize" type="range" min="0.2" max="3" step="0.01" value="1.25"></div>
  <div class="row"><label>rim band</label><output id="o-rimBand"></output><input id="rimBand" type="range" min="0" max="1" step="0.01" value="0.55"></div>
  <div class="row"><label>drift</label><output id="o-drift"></output><input id="drift" type="range" min="0" max="4" step="0.01" value="1"></div>
  <h2>light</h2>
  <div class="row"><label>glow</label><output id="o-glow"></output><input id="glow" type="range" min="0" max="2" step="0.01" value="0.55"></div>
  <div class="row"><label>glow size</label><output id="o-glowSize"></output><input id="glowSize" type="range" min="0.02" max="1.2" step="0.005" value="0.28"></div>
  <h2>grain</h2>
  <div class="row"><label>amount</label><output id="o-grain"></output><input id="grain" type="range" min="0" max="0.6" step="0.005" value="0.075"></div>
  <div class="row"><label>size</label><output id="o-grainSize"></output><input id="grainSize" type="range" min="0.2" max="3" step="0.01" value="2.2"></div>
  <div class="row"><label>on body</label><output id="o-grainMask"></output><input id="grainMask" type="range" min="0" max="1" step="0.01" value="1"></div>
  <h2>colour</h2>
  <div class="crow"><label>hot</label><input id="hot" type="color" value="#ffc93f"><input id="hot-hex" class="hex" type="text" spellcheck="false" value="#ffc93f"></div>
  <div class="crow"><label>mid</label><input id="mid" type="color" value="#f03b0c"><input id="mid-hex" class="hex" type="text" spellcheck="false" value="#f03b0c"></div>
  <div class="crow"><label>rim</label><input id="rim" type="color" value="#d1101c"><input id="rim-hex" class="hex" type="text" spellcheck="false" value="#d1101c"></div>
  <div class="crow"><label>glow col</label><input id="glowCol" type="color" value="#ff2a0a"><input id="glowCol-hex" class="hex" type="text" spellcheck="false" value="#ff2a0a"></div>
  <div class="crow"><label>bg</label><input id="bgA" type="color" value="#2a0603"><input id="bgA-hex" class="hex" type="text" spellcheck="false" value="#2a0603"></div>
  <div class="crow"><label>bg lo</label><input id="bgB" type="color" value="#0a0201"><input id="bgB-hex" class="hex" type="text" spellcheck="false" value="#0a0201"></div>
  <button class="btn" id="copy">copy settings</button>
</div>
<script type="module" src="/src/sun.js"></script>
</body>
</html>
