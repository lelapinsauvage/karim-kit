<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>sun</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0B0B0C}
  body{font:11px/1.5 ui-monospace,monospace;color:#eee}
  canvas{position:fixed;top:0;left:0;display:block}
  .panel{position:fixed;top:14px;right:14px;z-index:10;width:216px;padding:13px;
    background:#0b0b0be6;backdrop-filter:blur(8px);border:1px solid #ffffff1f;
    display:grid;gap:7px;max-height:94vh;overflow:auto}
  h2{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.45;font-weight:500}
  .row{display:grid;grid-template-columns:1fr auto;gap:4px}
  label{letter-spacing:.05em;opacity:.8} output{font-variant-numeric:tabular-nums;opacity:.5}
  input[type=range]{grid-column:1/-1;width:100%;accent-color:#FF4A1E;height:12px}
  input[type=color]{width:100%;height:19px;padding:0;border:1px solid #ffffff1f;background:none}
  .crow{display:grid;grid-template-columns:52px 30px 1fr;gap:5px;align-items:center}
  .crow label{opacity:.8}
  .hex{width:100%;background:#ffffff10;border:1px solid #ffffff1f;color:#eee;
    font:10px ui-monospace,monospace;padding:3px 5px;letter-spacing:.04em}
  .btn{width:100%;background:#ffffff12;border:1px solid #ffffff26;color:#eee;
    font:10px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
    padding:6px;cursor:pointer;margin-top:2px}
  .btn:hover{background:#ffffff20}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .preset{background:#ffffff10;border:1px solid #ffffff1f;color:#eee9;
    font:10px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
    padding:7px 4px;cursor:pointer;display:flex;justify-content:center;gap:6px}
  .preset span{opacity:.35}
  .preset:hover{background:#ffffff18}
  .preset[aria-current="true"]{background:#ffffff1f;color:#fff;border-color:#ffffff45}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h2>look</h2>
  <div class="presets">
    <button class="preset" data-k="EMBER">ember <span>1</span></button>
    <button class="preset" data-k="ULTRA">ultra <span>2</span></button>
  </div>
  <h2>body</h2>
  <div class="row"><label>radius</label><output id="o-r"></output><input id="r" type="range" min="0.05" max="0.8" step="0.005" value="0.30"></div>
  <div class="row"><label>edge</label><output id="o-edge"></output><input id="edge" type="range" min="0.001" max="0.8" step="0.001" value="0.400"></div>
  <div class="row"><label>core x</label><output id="o-coreX"></output><input id="coreX" type="range" min="-1" max="1" step="0.01" value="0.22"></div>
  <div class="row"><label>core y</label><output id="o-coreY"></output><input id="coreY" type="range" min="-1" max="1" step="0.01" value="0.07"></div>
  <div class="row"><label>core size</label><output id="o-coreSize"></output><input id="coreSize" type="range" min="0.2" max="3" step="0.01" value="0.99"></div>
  <div class="row"><label>rim band</label><output id="o-rimBand"></output><input id="rimBand" type="range" min="0" max="1" step="0.01" value="0.53"></div>
  <div class="row"><label>drift</label><output id="o-drift"></output><input id="drift" type="range" min="0" max="4" step="0.01" value="1"></div>
  <h2>light</h2>
  <div class="row"><label>glow</label><output id="o-glow"></output><input id="glow" type="range" min="0" max="2" step="0.01" value="0.68"></div>
  <div class="row"><label>glow size</label><output id="o-glowSize"></output><input id="glowSize" type="range" min="0.02" max="1.2" step="0.005" value="0.26"></div>
  <div class="row"><label>wobble</label><output id="o-wobble"></output><input id="wobble" type="range" min="0" max="2" step="0.01" value="0.45"></div>
  <h2>cloth</h2>
  <div class="row"><label>opacity</label><output id="o-cloth"></output><input id="cloth" type="range" min="0" max="1" step="0.005" value="0.14"></div>
  <div class="row"><label>scale</label><output id="o-clothScale"></output><input id="clothScale" type="range" min="4" max="60" step="0.5" value="33"></div>
  <div class="row"><label>family</label><output id="o-clothShape"></output><input id="clothShape" type="range" min="0" max="2.999" step="0.001" value="2.729"></div>
  <div class="row"><label>morph</label><output id="o-clothMorph"></output><input id="clothMorph" type="range" min="0" max="3" step="0.01" value="2"></div>
  <div class="row"><label>wave</label><output id="o-clothWave"></output><input id="clothWave" type="range" min="0" max="20" step="0.05" value="7.5"></div>
  <div class="row"><label>wave speed</label><output id="o-clothSpeed"></output><input id="clothSpeed" type="range" min="0" max="5" step="0.01" value="1.9"></div>
  <div class="row"><label>weight</label><output id="o-clothWeight"></output><input id="clothWeight" type="range" min="0.02" max="0.3" step="0.005" value="0.095"></div>
  <div class="row"><label>charge</label><output id="o-charge"></output><input id="charge" type="range" min="0" max="2" step="0.01" value="0.33"></div>
  <div class="row"><label>speed</label><output id="o-chargeSpd"></output><input id="chargeSpd" type="range" min="0" max="3" step="0.01" value="0.55"></div>
  <div class="row"><label>wavelength</label><output id="o-chargeLen"></output><input id="chargeLen" type="range" min="1" max="30" step="0.1" value="9"></div>
  <div class="row"><label>lit by halo</label><output id="o-light"></output><input id="light" type="range" min="0" max="4" step="0.01" value="1.4"></div>
  <div class="row"><label>rake</label><output id="o-rake"></output><input id="rake" type="range" min="0" max="1" step="0.01" value="0.82"></div>
  <div class="row"><label>sheen</label><output id="o-sheen"></output><input id="sheen" type="range" min="0" max="3" step="0.01" value="0.9"></div>
  <div class="row"><label>cord</label><output id="o-cord"></output><input id="cord" type="range" min="0" max="4" step="0.01" value="1.3"></div>
  <div class="crow"><label>cloth ink</label><input id="clothInk" type="color" value="#8c8c8c"><input id="clothInk-hex" class="hex" type="text" spellcheck="false" value="#8c8c8c"></div>
  <h2>figure</h2>
  <div class="crow"><label>show</label><input id="figShow" type="checkbox" checked><span style="opacity:.4">relit</span></div>
  <div class="row"><label>height</label><output id="o-figH"></output><input id="figH" type="range" min="0.4" max="3" step="0.005" value="1.42"></div>
  <div class="row"><label>x</label><output id="o-figX"></output><input id="figX" type="range" min="-0.8" max="0.8" step="0.005" value="0.04"></div>
  <div class="row"><label>y</label><output id="o-figY"></output><input id="figY" type="range" min="-1.4" max="0.6" step="0.005" value="-0.52"></div>
  <div class="row"><label>form</label><output id="o-figForm"></output><input id="figForm" type="range" min="0" max="3" step="0.01" value="1.35"></div>
  <div class="row"><label>weave</label><output id="o-figWeave"></output><input id="figWeave" type="range" min="0" max="3" step="0.01" value="0.5"></div>
  <div class="row"><label>rake</label><output id="o-figRake"></output><input id="figRake" type="range" min="0" max="1" step="0.01" value="0.72"></div>
  <div class="row"><label>sheen</label><output id="o-figSheen"></output><input id="figSheen" type="range" min="0" max="4" step="0.01" value="0.45"></div>
  <div class="row"><label>exposure</label><output id="o-figExpose"></output><input id="figExpose" type="range" min="0" max="5" step="0.01" value="1.25"></div>
  <div class="row"><label>ambient</label><output id="o-figAmbient"></output><input id="figAmbient" type="range" min="0" max="3" step="0.01" value="0.85"></div>
  <h2>grain</h2>
  <div class="row"><label>amount</label><output id="o-grain"></output><input id="grain" type="range" min="0" max="0.6" step="0.005" value="0.09"></div>
  <div class="row"><label>size</label><output id="o-grainSize"></output><input id="grainSize" type="range" min="0.2" max="3" step="0.01" value="2.98"></div>
  <div class="row"><label>on body</label><output id="o-grainMask"></output><input id="grainMask" type="range" min="0" max="1" step="0.01" value="0.4"></div>
  <h2>colour</h2>
  <div class="crow"><label>pigment</label><input id="pigment" type="color" value="#990000"><input id="pigment-hex" class="hex" type="text" spellcheck="false" value="#990000"></div>
  <div class="crow"><label>link bg</label><input id="linkBg" type="checkbox"><span style="opacity:.4">ground = pigment</span></div>
  <div class="crow"><label>ground</label><input id="bg" type="color" value="#333333"><input id="bg-hex" class="hex" type="text" spellcheck="false" value="#333333"></div>
  <div class="row"><label>ground fall</label><output id="o-bgFall"></output><input id="bgFall" type="range" min="0.05" max="1.2" step="0.01" value="0.38"></div>
  <div class="row"><label>warmth</label><output id="o-warmth"></output><input id="warmth" type="range" min="0" max="1" step="0.01" value="0.35"></div>
  <div class="row"><label>purity</label><output id="o-purity"></output><input id="purity" type="range" min="0" max="1" step="0.01" value="0.7"></div>
  <div class="row"><label>ground floor</label><output id="o-bgFloor"></output><input id="bgFloor" type="range" min="0" max="1" step="0.01" value="0.35"></div>
  <div class="row"><label>spread</label><output id="o-spread"></output><input id="spread" type="range" min="0" max="2" step="0.01" value="0.3"></div>
  <button class="btn" id="copy">copy settings</button>
</div>
<script type="module" src="/src/sun.js"></script>
</body>
</html>
