<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>sun</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0B0B0C}
  body{font:11px/1.5 ui-monospace,monospace;color:#eee}
  canvas{position:fixed;top:0;left:0;display:block}
  .panel{position:fixed;top:14px;right:14px;z-index:10;width:216px;padding:13px;
    background:#0b0b0be6;backdrop-filter:blur(8px);border:1px solid #ffffff1f;
    display:grid;gap:7px;max-height:94vh;overflow:auto}
  h2{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.45;font-weight:500}
  .row{display:grid;grid-template-columns:1fr auto;gap:4px}
  label{letter-spacing:.05em;opacity:.8} output{font-variant-numeric:tabular-nums;opacity:.5}
  input[type=range]{grid-column:1/-1;width:100%;accent-color:#FF4A1E;height:12px}
  input[type=color]{width:100%;height:19px;padding:0;border:1px solid #ffffff1f;background:none}
  .crow{display:grid;grid-template-columns:52px 30px 1fr;gap:5px;align-items:center}
  .crow label{opacity:.8}
  .hex{width:100%;background:#ffffff10;border:1px solid #ffffff1f;color:#eee;
    font:10px ui-monospace,monospace;padding:3px 5px;letter-spacing:.04em}
  .btn{width:100%;background:#ffffff12;border:1px solid #ffffff26;color:#eee;
    font:10px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
    padding:6px;cursor:pointer;margin-top:2px}
  .btn:hover{background:#ffffff20}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .preset{background:#ffffff10;border:1px solid #ffffff1f;color:#eee9;
    font:10px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
    padding:7px 4px;cursor:pointer;display:flex;justify-content:center;gap:6px}
  .preset span{opacity:.35}
  .preset:hover{background:#ffffff18}
  .preset[aria-current="true"]{background:#ffffff1f;color:#fff;border-color:#ffffff45}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h2>look</h2>
  <div class="presets">
    <button class="preset" data-k="EMBER">ember <span>1</span></button>
    <button class="preset" data-k="ULTRA">ultra <span>2</span></button>
  </div>
  <h2>body</h2>
  <div class="row"><label>radius</label><output id="o-r"></output><input id="r" type="range" min="0.05" max="0.8" step="0.005" value="0.30"></div>
  <div class="row"><label>edge</label><output id="o-edge"></output><input id="edge" type="range" min="0.001" max="0.4" step="0.001" value="0.125"></div>
  <div class="row"><label>core x</label><output id="o-coreX"></output><input id="coreX" type="range" min="-1" max="1" step="0.01" value="0.22"></div>
  <div class="row"><label>core y</label><output id="o-coreY"></output><input id="coreY" type="range" min="-1" max="1" step="0.01" value="0.07"></div>
  <div class="row"><label>core size</label><output id="o-coreSize"></output><input id="coreSize" type="range" min="0.2" max="3" step="0.01" value="0.99"></div>
  <div class="row"><label>rim band</label><output id="o-rimBand"></output><input id="rimBand" type="range" min="0" max="1" step="0.01" value="0.53"></div>
  <div class="row"><label>drift</label><output id="o-drift"></output><input id="drift" type="range" min="0" max="4" step="0.01" value="1"></div>
  <h2>light</h2>
  <div class="row"><label>glow</label><output id="o-glow"></output><input id="glow" type="range" min="0" max="2" step="0.01" value="0.68"></div>
  <div class="row"><label>glow size</label><output id="o-glowSize"></output><input id="glowSize" type="range" min="0.02" max="1.2" step="0.005" value="0.26"></div>
  <div class="row"><label>wobble</label><output id="o-wobble"></output><input id="wobble" type="range" min="0" max="2" step="0.01" value="0.45"></div>
  <h2>grain</h2>
  <div class="row"><label>amount</label><output id="o-grain"></output><input id="grain" type="range" min="0" max="0.6" step="0.005" value="0.09"></div>
  <div class="row"><label>size</label><output id="o-grainSize"></output><input id="grainSize" type="range" min="0.2" max="3" step="0.01" value="2.98"></div>
  <div class="row"><label>on body</label><output id="o-grainMask"></output><input id="grainMask" type="range" min="0" max="1" step="0.01" value="0.4"></div>
  <h2>colour</h2>
  <div class="crow"><label>pigment</label><input id="pigment" type="color" value="#990000"><input id="pigment-hex" class="hex" type="text" spellcheck="false" value="#990000"></div>
  <div class="crow"><label>link bg</label><input id="linkBg" type="checkbox" checked><span style="opacity:.4">ground = pigment</span></div>
  <div class="crow"><label>ground</label><input id="bg" type="color" value="#990000"><input id="bg-hex" class="hex" type="text" spellcheck="false" value="#990000"></div>
  <div class="row"><label>ground fall</label><output id="o-bgFall"></output><input id="bgFall" type="range" min="0.05" max="1.2" step="0.01" value="0.38"></div>
  <div class="row"><label>warmth</label><output id="o-warmth"></output><input id="warmth" type="range" min="0" max="1" step="0.01" value="0.35"></div>
  <div class="row"><label>purity</label><output id="o-purity"></output><input id="purity" type="range" min="0" max="1" step="0.01" value="0.7"></div>
  <div class="row"><label>spread</label><output id="o-spread"></output><input id="spread" type="range" min="0" max="2" step="0.01" value="0.3"></div>
  <button class="btn" id="copy">copy settings</button>
</div>
<script type="module" src="/src/sun.js"></script>
</body>
</html>
