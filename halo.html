<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>halo</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0B0B0C; }
  body { font: 11px/1.5 ui-monospace, monospace; color: #eee; }
  canvas { position: fixed; top: 0; left: 0; display: block; }
  .panel {
    position: fixed; top: 14px; right: 14px; z-index: 10; width: 224px; padding: 13px;
    background: #0b0b0be6; backdrop-filter: blur(8px); border: 1px solid #ffffff1f;
    display: grid; gap: 8px; max-height: 94vh; overflow: auto;
  }
  h2 { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; opacity: .45; font-weight: 500; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 5px; }
  label { letter-spacing: .05em; opacity: .8; }
  output { font-variant-numeric: tabular-nums; opacity: .5; }
  input[type=range] { grid-column: 1/-1; width: 100%; accent-color: #D50208; height: 13px; }
  input[type=color] { width: 100%; height: 20px; padding: 0; border: 1px solid #ffffff1f; background: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h2>halo</h2>
  <div class="row"><label>radius</label><output id="o-r"></output><input id="r" type="range" min="0.05" max="0.9" step="0.005" value="0.21"></div>
  <div class="row"><label>bloom</label><output id="o-bloom"></output><input id="bloom" type="range" min="0.01" max="1" step="0.005" value="0.23"></div>
  <div class="row"><label>bloom op</label><output id="o-bloomOp"></output><input id="bloomOp" type="range" min="0" max="1.5" step="0.01" value="0.32"></div>
  <div class="row"><label>front op</label><output id="o-frontOp"></output><input id="frontOp" type="range" min="0" max="1" step="0.01" value="0.81"></div>
  <div class="row"><label>intensity</label><output id="o-intensity"></output><input id="intensity" type="range" min="0" max="1" step="0.01" value="0.92"></div>
  <h2>body</h2>
  <div class="row"><label>grain</label><output id="o-grainSz"></output><input id="grainSz" type="range" min="0.5" max="12" step="0.1" value="3.4"></div>
  <div class="row"><label>churn</label><output id="o-churn"></output><input id="churn" type="range" min="0" max="4" step="0.01" value="1.0"></div>
  <div class="row"><label>glitter</label><output id="o-glitter"></output><input id="glitter" type="range" min="0" max="2" step="0.01" value="0.35"></div>
  <div class="row"><label>limb</label><output id="o-limb"></output><input id="limb" type="range" min="0" max="1" step="0.01" value="0.45"></div>
  <div class="row"><label>flare</label><output id="o-flare"></output><input id="flare" type="range" min="0" max="2" step="0.01" value="0.35"></div>
  <h2>field</h2>
  <div class="row"><label>tile shape</label><output id="o-groundShape"></output><input id="groundShape" type="range" min="0" max="2.999" step="0.001" value="0.92"></div>
  <div class="row"><label>glyph scale</label><output id="o-glyphScale"></output><input id="glyphScale" type="range" min="4" max="40" step="0.5" value="24.5"></div>
  <div class="row"><label>field op</label><output id="o-fieldOp"></output><input id="fieldOp" type="range" min="0" max="1" step="0.01" value="0.09"></div>
  <h2>cursor</h2>
  <div class="row"><label>radius</label><output id="o-mouseR"></output><input id="mouseR" type="range" min="0.05" max="1.2" step="0.01" value="0.42"></div>
  <div class="row"><label>grid</label><output id="o-gridAmt"></output><input id="gridAmt" type="range" min="0" max="1" step="0.01" value="0.8"></div>
  <div class="row"><label>grid cells</label><output id="o-gridN"></output><input id="gridN" type="range" min="4" max="60" step="1" value="26"></div>
  <div class="row"><label>strength</label><output id="o-mouseAmt"></output><input id="mouseAmt" type="range" min="0" max="2" step="0.01" value="0.8"></div>
  <h2>colour</h2>
  <div class="row"><label>pigment</label><input id="pigment" type="color" value="#d50208"></div>
  <div class="row"><label>hot</label><input id="hot" type="color" value="#ff8a5c"></div>
  <div class="row"><label>glyph ink</label><input id="glyphInk" type="color" value="#6e6a64"></div>
  <div class="row"><label>ground</label><input id="groundA" type="color" value="#241f21"></div>
  <div class="row"><label>ground lo</label><input id="groundB" type="color" value="#100d0f"></div>
</div>
<script type="module" src="/src/halo.js"></script>
</body>
</html>
